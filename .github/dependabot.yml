# Dependabot version updates for the sandbox. Kept small on purpose: one ecosystem, patch updates only,
# at most two open pull requests at a time.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
