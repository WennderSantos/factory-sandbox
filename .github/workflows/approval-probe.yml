name: approval-probe
on: pull_request
jobs:
  read:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", GH_REPO: "${{ github.repository }}" }
    steps:
      - run: gh pr review "$PR" --approve --body "probe: contents read"
      - run: sleep 5; gh pr view "$PR" --json reviewDecision,reviews
  write:
    needs: read
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", GH_REPO: "${{ github.repository }}" }
    steps:
      - run: gh pr review "$PR" --approve --body "probe: contents write"
      - run: sleep 5; gh pr view "$PR" --json reviewDecision,reviews
