name: approval-probe
on: pull_request
jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh pr review "$PR" --approve --body "probe with contents read"
          sleep 5
          gh pr view "$PR" --json reviewDecision
  write:
    needs: read
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh pr review "$PR" --approve --body "probe with contents write"
          sleep 5
          gh pr view "$PR" --json reviewDecision
